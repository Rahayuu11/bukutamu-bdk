<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Password Baru</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-emerald-50 flex items-center justify-center p-4">
    <form id="resetForm" class="w-full max-w-md bg-white p-6 rounded-xl shadow-lg space-y-4">
        <h1 class="text-xl font-bold text-emerald-900">Buat Password Baru</h1>
        <input id="password" type="password" minlength="6" required placeholder="Password baru minimal 6 karakter" class="w-full border rounded-lg p-3">
        <input id="confirmPassword" type="password" minlength="6" required placeholder="Ulangi password baru" class="w-full border rounded-lg p-3">
        <button class="w-full bg-emerald-800 text-white font-bold rounded-lg p-3">Simpan Password</button>
        <p id="status" class="text-sm"></p>
    </form>
    <script>
        const token = new URLSearchParams(window.location.search).get('token');
        const form = document.getElementById('resetForm');
        const status = document.getElementById('status');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!token || password !== confirmPassword) {
                status.textContent = 'Token tidak valid atau password tidak sama.';
                status.className = 'text-sm text-red-600';
                return;
            }

            const response = await fetch('http://localhost/buku-tamu-bdk/backend/complete-reset.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ token, password })
            });
            const result = await response.json();
            status.textContent = result.message;
            status.className = result.success ? 'text-sm text-green-600' : 'text-sm text-red-600';
            if (result.success) setTimeout(() => { window.location.href = 'login.html'; }, 1500);
        });
    </script>
</body>
</html>
